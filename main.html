<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layered Scroll Effect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      /* height: 500vh;  */
      /* Enough scroll space */
    }

    .section {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
      transition: transform 0.3s ease;
    }

    .section:nth-child(1) {
      background: #1abc9c;
      z-index: 1;
    }

    .section:nth-child(2) {
      background: #3498db;
      z-index: 2;
    }

    .section:nth-child(3) {
      background: #9b59b6;
      z-index: 3;
    }

    .section:nth-child(4) {
      background: #e67e22;
      z-index: 4;
    }

    .section:nth-child(5) {
      background: #e74c3c;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="section">Section 1</div>
  <div class="section">Section 2</div>
  <div class="section">Section 3</div>
  <div class="section">Section 4</div>
  <div class="section">Section 5</div>

</body>
</html>
